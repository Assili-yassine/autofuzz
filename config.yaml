# AutoFuzz default configuration.
# Every value here can be overridden by a CLI flag.

general:
  threads: 25
  timeout: 10          # seconds, per HTTP request
  rate_limit: 0        # requests/sec, 0 = unlimited (be a good citizen)
  user_agent: "AutoFuzz/1.0 (+authorized-recon)"
  output_dir: "results"
  silent: false
  debug: false

ffuf:
  threads: 40
  match_codes: [200, 201, 202, 204, 301, 302, 307, 308, 401, 403, 405, 500, 502, 503]
  filter_codes: [404, 400]
  # OFF by default — recursion re-runs the ENTIRE wordlist against every
  # discovered directory. Combined with a large merged wordlist (JS
  # endpoints + LinkFinder + gau/katana/wayback + any -w file) this can
  # multiply total requests by a huge, unpredictable factor and turn a
  # normal run into an hours-long one. Turn on deliberately, ideally only
  # with a small, curated wordlist.
  recursion: false
  recursion_depth: 2
  # OFF by default — when on, ffuf additionally tries every wordlist entry
  # once per extension below (17x more requests for the default list).
  # Our merged wordlist is built from real scraped paths/endpoints that
  # usually already include their real extension, so blind extension
  # fuzzing on top of it is mostly wasted request volume. Turn on if you
  # want it (e.g. against a small, purely directory-style wordlist).
  use_extensions: false
  filter_size: 0        # -fs
  auto_calibrate: true  # -ac — can suppress real hits on targets that return
                          # a consistent catch-all/soft-404 response for
                          # every unknown path (common on SPAs); set false
                          # if you're seeing 0 results despite known endpoints.

extensions:
  - .php
  - .aspx
  - .asp
  - .jsp
  - .do
  - .action
  - .cgi
  - .json
  - .xml
  - .bak
  - .old
  - .zip
  - .tar
  - .gz
  - .env
  - .git

wordlists:
  # Paths are optional; missing files are skipped with a warning.
  seclists_directory_medium: "/usr/share/seclists/Discovery/Web-Content/directory-list-2.3-medium.txt"
  seclists_raft_small: "/usr/share/seclists/Discovery/Web-Content/raft-small-directories.txt"
  custom_output: "custom_wordlist.txt"
  # Dropped entirely when building the wordlist — these carry no security
  # signal (static assets), so fuzzing them just wastes requests.
  skip_extensions:
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .svg
    - .ico
    - .webp
    - .bmp
    - .tiff
    - .avif
    - .woff
    - .woff2
    - .ttf
    - .eot
    - .otf
    - .css
    - .map
    - .mp4
    - .mp3
    - .avi
    - .mov
    - .webm
    - .ogg
    - .wav

content_keywords:
  - login
  - admin
  - dashboard
  - graphql
  - swagger
  - api
  - upload
  - debug
  - internal

api_discovery_paths:
  - /swagger.json
  - /swagger/v1/swagger.json
  - /openapi.json
  - /v2/api-docs
  - /graphql
  - /graphiql
